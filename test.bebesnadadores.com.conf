# Bebés Nadadores - entorno de pruebas
# Configuración HTTP inicial. Activar HTTPS antes de acceder con credenciales.
server {
    listen 80;
    server_name test.bebesnadadores.com;

    client_max_body_size 150m;

    auth_basic "Bebes Nadadores TEST";
    auth_basic_user_file /etc/nginx/.htpasswd-bbn-test;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
